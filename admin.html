        input { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: #e74c3c; }
        .btn-move { background: #3498db; padding: 5px 10px; margin-right: 2px; }
        .card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        .product-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; background: white; padding: 8px; border-radius: 5px; border: 1px solid #eee; }

    </style>

    const firebaseConfig = {
        apiKey: "SENIN_API_KEY",
        authDomain: "SENIN_PROJECT.firebaseapp.com",
        databaseURL: "https://console.firebase.google.com/project/gggg-10250/database/gggg-10250-default-rtdb/data/~2F",
        projectId: "SENIN_PROJECT",
        storageBucket: "SENIN_PROJECT.appspot.com",
        messagingSenderId: "123456",
        appId: "1:123456:web:123"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localData = varsayilanMenu;

    // Veritabanını kontrol et, varsa onu getir; yoksa hazırdaki ürünleri bas
    db.ref('menu').once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) localData = data;
        
        document.getElementById('pastaneAdi').value = localData.pastaneAdi || '';
        document.getElementById('altBaslik').value = localData.altBaslik || '';
        document.getElementById('bannerResmi').value = localData.bannerResmi || '';

        arayuzCiz();
    });

    function arayuzCiz() {
        const container = document.getElementById('categories-container');
        container.innerHTML = '';

        if (!localData.kategoriler) localData.kategoriler = [];

        localData.kategoriler.forEach((kat, kIdx) => {
            if (!kat.urunler) kat.urunler = [];

            let urunlerHtml = '';
            kat.urunler.forEach((u, uIdx) => {
                urunlerHtml += `
                    <div class="product-row">
                        <button class="btn-move" onclick="urunKaydir(${kIdx}, ${uIdx}, -1)">▲</button>
                        <button class="btn-move" onclick="urunKaydir(${kIdx}, ${uIdx}, 1)">▼</button>
                        <input type="text" placeholder="Ürün Adı" value="${u.isim}" onchange="localData.kategoriler[${kIdx}].urunler[${uIdx}].isim = this.value">
                        <input type="text" placeholder="Fiyat" value="${u.fiyat}" style="width:70px;" onchange="localData.kategoriler[${kIdx}].urunler[${uIdx}].fiyat = this.value">
                        <input type="text" placeholder="Resim Linki" value="${u.resim || ''}" onchange="localData.kategoriler[${kIdx}].urunler[${uIdx}].resim = this.value">
                        <button class="btn-danger" onclick="urunSil(${kIdx}, ${uIdx})">X</button>
                    </div>
                `;
            });

            const katHtml = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>Kategori #${kIdx + 1}: ${kat.isim}</h3>
                        <div>
                            <button class="btn-move" onclick="kategoriKaydir(${kIdx}, -1)">Yukarı ▲</button>
                            <button class="btn-move" onclick="kategoriKaydir(${kIdx}, 1)">Aşağı ▼</button>
                            <button class="btn-danger" onclick="kategoriSil(${kIdx})">Kategoriyi Sil</button>
                        </div>
                    </div>
                    <label>Kategori Adı:</label>
                    <input type="text" value="${kat.isim}" onchange="localData.kategoriler[${kIdx}].isim = this.value">
                    <label>Kategori Resim Linki:</label>
                    <input type="text" value="${kat.resim || ''}" onchange="localData.kategoriler[${kIdx}].resim = this.value">

                    <h4>Ürünler (${kat.urunler.length} Tane)</h4>
                    ${urunlerHtml}
                    <button style="margin-top:10px; background:#e67e22;" onclick="urunEkle(${kIdx})">+ Bu Kategoriye Ürün Ekle</button>
                </div>
            `;
            container.innerHTML += katHtml;
        });
    }

    function kategoriEkle() {
        localData.kategoriler.push({ isim: "Yeni Kategori", resim: "", urunler: [] });
        arayuzCiz();
    }
    function kategoriSil(kIdx) {
        if(confirm("Bu kategoriyi ve içindeki tüm ürünleri silmek istediğine emin misin?")) {
            localData.kategoriler.splice(kIdx, 1);
            arayuzCiz();
        }
    }
    function kategoriKaydir(kIdx, yon) {
        const yeniIdx = kIdx + yon;
        if (yeniIdx < 0 || yeniIdx >= localData.kategoriler.length) return;
        const temp = localData.kategoriler[kIdx];
        localData.kategoriler[kIdx] = localData.kategoriler[yeniIdx];
        localData.kategoriler[yeniIdx] = temp;
        arayuzCiz();
    }

    function urunEkle(kIdx) {
        localData.kategoriler[kIdx].urunler.push({ isim: "Yeni Ürün", fiyat: "0", resim: "" });
        arayuzCiz();
    }
    function urunSil(kIdx, uIdx) {
        localData.kategoriler[kIdx].urunler.splice(uIdx, 1);
        arayuzCiz();
    }
    function urunKaydir(kIdx, uIdx, yon) {
        const urunler = localData.kategoriler[kIdx].urunler;
        const yeniIdx = uIdx + yon;
        if (yeniIdx < 0 || yeniIdx >= urunler.length) return;
        const temp = urunler[uIdx];
        urunler[uIdx] = urunler[yeniIdx];
        urunler[yeniIdx] = temp;
        arayuzCiz();
    }

    function verileriKaydet() {
        localData.pastaneAdi = document.getElementById('pastaneAdi').value;
        localData.altBaslik = document.getElementById('altBaslik').value;
        localData.bannerResmi = document.getElementById('bannerResmi').value;

        db.ref('menu').set(localData, (error) => {
            if (error) {
                alert("Hata oluştu: " + error.message);
            } else {
                alert("Tüm değişiklikler başarıyla CANLIYA AKTARILDI!");
            }
        });
    }
</script>
