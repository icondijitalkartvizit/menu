    let menuData = varsayilanMenu;

    function arayuzGuncelle(data) {
        document.getElementById('pastane-adi').innerText = data.pastaneAdi || "LA VIE";
        document.getElementById('alt-baslik').innerText = data.altBaslik || "PATISSERIE & CAFE - ILGIN";
        document.getElementById('banner-img').src = data.bannerResmi || "https://via.placeholder.com/800x400";

        const catList = document.getElementById('category-list');
        catList.innerHTML = '';

        if (data.kategoriler) {
            data.kategoriler.forEach((kat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => kategoriAc(index);
                card.innerHTML = `
                    <img src="${kat.resim || 'https://via.placeholder.com/100'}" alt="${kat.isim}">
                    <div class="title">${kat.isim}</div>
                `;
                catList.appendChild(card);
            });
        }
    }

    arayuzGuncelle(varsayilanMenu);

    db.ref('menu').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            menuData = data;
            arayuzGuncelle(menuData);
        }
    });

    function kategoriAc(katIndex) {
        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('detail-page').classList.remove('hidden');
        
        const kat = menuData.kategoriler[katIndex];
        document.getElementById('secilen-kategori-baslik').innerText = kat.isim;

        const prodList = document.getElementById('product-list');
        prodList.innerHTML = '';

        if (kat.urunler) {
            kat.urunler.forEach(u => {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.innerHTML = `
                    <img src="${u.resim || 'https://via.placeholder.com/100'}" alt="${u.isim}">
                    <div class="item-details">
                        <div class="item-title">${u.isim}</div>
                        <div class="item-price">${u.fiyat} ₺</div>
                    </div>
                `;
                prodList.appendChild(item);
            });
        }
        window.scrollTo(0, 0);
    }

    function anaSayfayaDon() {
        document.getElementById('detail-page').classList.add('hidden');
        document.getElementById('home-page').classList.remove('hidden');
        window.scrollTo(0, 0);
    }
