<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastane Menüsü & Yönetim Paneli</title>
    <style>
        :root {
            --para-birimi: "₺";
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }

        /* BANNER VE BAŞLIK */
        .banner-container { position: relative; width: 100%; height: 200px; overflow: hidden; background: #222; }
        .banner-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .banner-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; }
        .banner-text h1 { margin: 0; font-size: 26px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); letter-spacing: 1px; }
        .banner-text p { margin: 5px 0 0 0; font-size: 14px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); opacity: 0.9; }

        .content { padding: 20px; }

        /* KATEGORİ LİSTESİ */
        .category-card { display: flex; align-items: center; background: #fff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; padding: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .category-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .category-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .category-card .title { font-size: 18px; font-weight: 600; color: #2c3e50; }

        /* ÜRÜN LİSTESİ */
        .page-header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 15px; }
        .category-title-header { font-size: 20px; margin: 0; color: #c0392b; border-bottom: 2px solid #c0392b; padding-bottom: 5px; width: 100%; }

        .menu-item { display: flex; background: white; border-bottom: 1px solid #eee; padding: 12px 0; align-items: center; }
        .menu-item img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .item-details { display: flex; flex-direction: column; }
        .item-title { font-size: 16px; font-weight: 600; color: #333; }
        .item-price { font-size: 15px; color: #27ae60; font-weight: bold; margin-top: 5px; }
        .item-price::after { content: " " var(--para-birimi); }

        /* CANLIYA KAYDET BUTONU VE YÖNETİM ALANI */
        .save-box { background: #2c3e50; padding: 15px; text-align: center; color: white; position: sticky; top: 0; z-index: 999; }
        .save-btn { background: #27ae60; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .save-btn:hover { background: #219150; }

        .hidden { display: none; }
    </style>
</head>
<body>

<!-- EN ÜSTKİ CANLIYA KAYDET PANELİ -->
<div class="save-box">
    <button class="save-btn" onclick="verileriKaydet()">TÜM DEĞİŞİKLİKLERİ CANLIYA KAYDET</button>
</div>

<div class="container">
    <!-- ANA SAYFA KISMI -->
    <div id="home-page">
        <div class="banner-container">
            <img id="banner-img" src="https://via.placeholder.com/800x400" alt="Banner">
            <div class="banner-text">
                <h1 id="pastane-adi">LA VIE</h1>
                <p id="alt-baslik">PATISSERIE & CAFE - ILGIN</p>
            </div>
        </div>

        <div class="content">
            <h3 style="margin-top:0; color:#555;">Kategoriler</h3>
            <div id="category-list"></div>
        </div>
    </div>

    <!-- ÜRÜNLER SAYFASI (DETAY) -->
    <div id="detail-page" class="content hidden">
        <div class="page-header">
            <button class="back-btn" onclick="anaSayfayaDon()">&larr; Geri</button>
            <h2 id="secilen-kategori-baslik" class="category-title-header"></h2>
        </div>
        <div id="product-list"></div>
    </div>
</div>

<!-- FIREBASE KÜTÜPHANELERİ (DOKUNMA) -->

        projectId: "gggg-10250",
        storageBucket: "gggg-10250.appspot.com",

    // Firebase'i Başlatma

    }
    const db = firebase.database();

    // Varsayılan Menü Verileri (Sistem İlk Açıldığında Yüklenecek)
    let localData = {

                ]
            },
            {
                ad: "Dondurma Çeşitleri",
                resim: "https://via.placeholder.com/100",
                urunler: [

                    { ad: "Sade Maraş", fiyat: "25", resim: "https://via.placeholder.com/100" },
                    { ad: "Çilek Maraş", fiyat: "25", resim: "https://via.placeholder.com/100" },

                ]
            },
            {

                urunler: [
                    { ad: "Enerji İçeceği (250 ml)", fiyat: "100", resim: "https://via.placeholder.com/100" },
                    { ad: "Enerji İçeceği (500 ml)", fiyat: "120", resim: "https://via.placeholder.com/100" }
                ]
            }
        ]
    };

    // Verileri Firebase'den Çekip Ekrana Basan Fonksiyon
    function verileriYukle() {
        db.ref('menu').once('value')
            .then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    localData = data;
                }
                ekraniGuncelle();
            })
            .catch((err) => {
                alert("YÜKLEME HATASI: " + err.message);
                ekraniGuncelle();
            });
    }

    // Ekrana Verileri Çizen Fonksiyon
    function ekraniGuncelle() {
        document.getElementById('pastane-adi').innerText = localData.pastaneAdi || 'LA VIE';
        document.getElementById('alt-baslik').innerText = localData.altBaslik || '';
        document.getElementById('banner-img').src = localData.bannerResmi || 'https://via.placeholder.com/800x400';

        const catList = document.getElementById('category-list');
        catList.innerHTML = '';

        if (localData.kategoriler) {
            localData.kategoriler.forEach((kat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => kategoriAc(index);
                card.innerHTML = `
                    <img src="${kat.resim || 'https://via.placeholder.com/100'}" alt="${kat.ad}">
                    <div class="title">${kat.ad}</div>
                `;
                catList.appendChild(card);
            });
        }
    }

    // Kategori Detay Sayfasını Açma
    function kategoriAc(index) {
        const kat = localData.kategoriler[index];
        if (!kat) return;

        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('detail-page').classList.remove('hidden');
        document.getElementById('secilen-kategori-baslik').innerText = kat.ad;

        const prodList = document.getElementById('product-list');
        prodList.innerHTML = '';

        if (kat.urunler) {
            kat.urunler.forEach((urun) => {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.innerHTML = `
                    <img src="${urun.resim || 'https://via.placeholder.com/100'}" alt="${urun.ad}">
                    <div class="item-details">
                        <div class="item-title">${urun.ad}</div>
                        <div class="item-price">${urun.fiyat}</div>
                    </div>
                `;
                prodList.appendChild(item);
            });
        }
        window.scrollTo(0, 0);
    }

    // Geri Butonu
    function anaSayfayaDon() {
        document.getElementById('detail-page').classList.add('hidden');
        document.getElementById('home-page').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // "TÜM DEĞİŞİKLİKLERİ CANLIYA KAYDET" Butonu Fonksiyonu
    function verileriKaydet() {
        try {
            alert("Veriler Firebase'e aktarılıyor kurbanım, bekle...");

            db.ref('menu').set(localData)
                .then(() => {
                    alert("BAŞARILI! Tüm menü canlıya aktarıldı kurbanım!");
                })
                .catch((error) => {
                    alert("FİREBASE HATASI: " + error.code + "\nMesaj: " + error.message);
                });
        } catch (err) {
            alert("KOD HATASI: " + err.message);
        }
    }

    // Sayfa Açıldığında Verileri Yükle
    window.onload = function() {
        verileriYukle();
    };
</script>

</body>
    </html>
