        /* TASARIM VE STİLLER */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }

        /* BANNER VE BAŞLIK */
        .banner-container { position: relative; width: 100%; height: 200px; overflow: hidden; background: #222; }
        .banner-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .banner-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; }
        .banner-text h1 { margin: 0; font-size: 26px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); letter-spacing: 1px; }
        .banner-text p { margin: 5px 0 0 0; font-size: 14px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); opacity: 0.9; }

        .content { padding: 20px; }

        /* KATEGORİ LİSTESİ */
        .category-card { display: flex; align-items: center; background: #fff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; padding: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .category-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .category-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .category-card .title { font-size: 18px; font-weight: 600; color: #2c3e50; }

        /* ÜRÜN LİSTESİ */
        .page-header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 15px; }
        .category-title-header { font-size: 20px; margin: 0; color: #c0392b; border-bottom: 2px solid #c0392b; padding-bottom: 5px; width: 100%; }

        .menu-item { display: flex; background: white; border-bottom: 1px solid #eee; padding: 12px 0; align-items: center; }
        .menu-item img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .item-details { display: flex; flex-direction: column; }
        .item-title { font-size: 16px; font-weight: 600; color: #333; }
        .item-price { font-size: 15px; color: #27ae60; font-weight: bold; margin-top: 5px; }
        .item-price::after { content: " " var(--para-birimi); }

        .hidden { display: none; }

<body>

<div class="container">
    <!-- ANA SAYFA KISMI -->
    <div id="home-page">
        <!-- BANNER VE BAŞLIKLAR -->
        <div class="banner-container">
            <img id="banner-img" src="" alt="Banner">
            <div class="banner-text">
                <h1 id="pastane-adi"></h1>
                <p id="alt-baslik"></p>
            </div>
        </div>

        <!-- KATEGORİLER -->
        <div class="content">
            <h3 style="margin-top:0; color:#555;">Kategoriler</h3>
            <div id="category-list"></div>
        </div>
    </div>

    <!-- ÜRÜNLER SAYFASI (DETAY) -->
    <div id="detail-page" class="content hidden">
        <div class="page-header">
            <button class="back-btn" onclick="anaSayfayaDon()">&larr; Geri</button>
            <h2 id="secilen-kategori-baslik" class="category-title-header"></h2>
        </div>
        <div id="product-list"></div>
    </div>
</div>

<script>
    const styles = getComputedStyle(document.documentElement);

    function cssOku(degisken) {
        return styles.getPropertyValue(degisken).replace(/"/g, '').trim();
    }

    // Ana Sayfa Yükleyici
    function anaSayfaYukle() {
        document.getElementById('banner-img').src = cssOku('--banner-resmi');
        document.getElementById('pastane-adi').innerText = cssOku('--pastane-adi');
        document.getElementById('alt-baslik').innerText = cssOku('--alt-baslik');

        const catList = document.getElementById('category-list');
        catList.innerHTML = '';

        for (let i = 1; i <= 6; i++) {
            const isim = cssOku(`--kat-${i}-isim`);
            const resim = cssOku(`--kat-${i}-resim`);

            if (isim && isim !== "") {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => kategoriAc(i, isim);
                card.innerHTML = `
                    <img src="${resim}" alt="${isim}">
                    <div class="title">${isim}</div>
                `;
                catList.appendChild(card);
            }
        }
    }

    // Kategoriye Tıklayınca Ürünleri Açma
    function kategoriAc(katNo, katIsmi) {
        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('detail-page').classList.remove('hidden');
        document.getElementById('secilen-kategori-baslik').innerText = katIsmi;

        const prodList = document.getElementById('product-list');
        prodList.innerHTML = '';

        for (let u = 1; u <= 10; u++) {
            const resim = cssOku(`--k${katNo}-u${u}-resim`);
            const isim = cssOku(`--k${katNo}-u${u}-isim`);
            const fiyat = cssOku(`--k${katNo}-u${u}-fiyat`);

            const item = document.createElement('div');
            item.className = 'menu-item';
            item.innerHTML = `
                <img src="${resim}" alt="${isim}">
                <div class="item-details">
                    <div class="item-title">${isim}</div>
                    <div class="item-price">${fiyat}</div>
                </div>
            `;
            prodList.appendChild(item);
        }
        window.scrollTo(0, 0);
    }

    // Geri Butonu
    function anaSayfayaDon() {
        document.getElementById('detail-page').classList.add('hidden');
        document.getElementById('home-page').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // Uygulamayı Başlat
    anaSayfaYukle();
</script>

</body>
